<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Financeira</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .titulo {
      font-size: 36px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .box {
      background: #111827;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    textarea {
      width: 100%;
      height: 140px;
      border: none;
      outline: none;
      border-radius: 15px;
      padding: 15px;
      background: #1e293b;
      color: white;
      resize: none;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      background: #2563eb;
      border: none;
      color: white;
      padding: 14px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .resposta {
      margin-top: 20px;
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      min-height: 100px;
      white-space: pre-wrap;
    }

    .perguntas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .pergunta {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .pergunta:hover {
      transform: scale(1.03);
      background: #334155;
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="titulo">🤖 IA Financeira Premium</div>

    <div class="box">

      <textarea id="pergunta" placeholder="Pergunte sobre ações, FIIs, dividendos, criptomoedas, risco, valuation..."></textarea>

      <button onclick="perguntarIA()">Perguntar IA</button>

      <div class="resposta" id="resposta">
        Sua resposta aparecerá aqui.
      </div>

    </div>

    <div class="perguntas">

      <div class="pergunta" onclick="usarPergunta(this)">
        Vale a pena investir em PETR4 hoje?
      </div>

      <div class="pergunta" onclick="usarPergunta(this)">
        Quais os melhores FIIs para dividendos?
      </div>

      <div class="pergunta" onclick="usarPergunta(this)">
        Bitcoin ainda tem potencial de alta?
      </div>

      <div class="pergunta" onclick="usarPergunta(this)">
        Como montar carteira para longo prazo?
      </div>

      <div class="pergunta" onclick="usarPergunta(this)">
        Qual ação mais segura da bolsa brasileira?
      </div>

      <div class="pergunta" onclick="usarPergunta(this)">
        Como viver de dividendos?
      </div>

    </div>

  </div>

  <script>

    function usarPergunta(el) {
      document.getElementById('pergunta').value = el.innerText;
    }

    async function perguntarIA() {

      const pergunta = document.getElementById('pergunta').value;

      const respostaDiv = document.getElementById('resposta');

      respostaDiv.innerHTML = 'Pensando...';

      try {

        const resposta = await fetch('/perguntar_ia', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            pergunta: pergunta
          })
        });

        const dados = await resposta.json();

        respostaDiv.innerHTML = dados.resposta;

      } catch (erro) {
        respostaDiv.innerHTML = 'Erro ao consultar IA.';
      }

    }

  </script>

</body>
</html>
