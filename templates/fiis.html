<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MR FIIs</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:
linear-gradient(
180deg,
#020617,
#071327
);

min-height:100vh;

padding:25px;

color:white;
}

.topo{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:35px;
}

.logo{

display:flex;
align-items:center;
gap:18px;
}

.icon{

width:72px;
height:72px;

border-radius:22px;

background:
linear-gradient(
135deg,
#1cff77,
#0f9e47
);

display:flex;
justify-content:center;
align-items:center;

font-size:34px;

box-shadow:
0 0 25px rgba(0,255,120,.25);
}

.textos h1{

font-size:46px;

background:
linear-gradient(
90deg,
white,
#65ff9c
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.textos p{

margin-top:5px;

font-size:16px;

opacity:.7;
}

.botao{

background:
linear-gradient(
135deg,
#1cff77,
#0f9e47
);

border:none;

padding:14px 24px;

border-radius:18px;

color:white;

font-size:15px;

font-weight:bold;

cursor:pointer;

box-shadow:
0 0 20px rgba(0,255,120,.2);
}

.market{

background:
rgba(255,255,255,.04);

border:
1px solid rgba(255,255,255,.06);

border-radius:28px;

padding:22px;

backdrop-filter:blur(10px);

margin-bottom:30px;
}

.live{

display:flex;
align-items:center;
gap:12px;
}

.ball{

width:12px;
height:12px;

border-radius:50%;

background:#1cff77;

box-shadow:
0 0 18px #1cff77;
}

.live h2{

font-size:22px;

color:#1cff77;
}

.market p{

margin-top:10px;

font-size:15px;

opacity:.75;
}

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:22px;
}

.card{

background:
linear-gradient(
180deg,
rgba(255,255,255,.06),
rgba(255,255,255,.03)
);

border:
1px solid rgba(255,255,255,.06);

border-radius:28px;

padding:24px;

backdrop-filter:blur(12px);

box-shadow:
0 0 25px rgba(0,0,0,.25);

transition:.3s;

position:relative;

overflow:hidden;
}

.card:hover{

transform:
translateY(-5px);

box-shadow:
0 0 35px rgba(0,255,120,.12);
}

.card::before{

content:"";

position:absolute;

width:160px;
height:160px;

border-radius:50%;

background:
rgba(0,255,120,.05);

top:-90px;
right:-90px;
}

.codigo{

font-size:30px;

font-weight:bold;

color:#65ff9c;
}

.preco{

font-size:34px;

font-weight:bold;

margin-top:14px;
}

.alta{

color:#1cff77;
}

.baixa{

color:#ff5f5f;
}

.variacao{

margin-top:10px;

font-size:18px;

font-weight:bold;
}

.info{

margin-top:16px;

font-size:14px;

opacity:.75;

line-height:1.6;
}

.grafico{

height:90px;

margin-top:22px;

border-radius:16px;

background:
linear-gradient(
180deg,
rgba(0,255,120,.14),
transparent
);

position:relative;

overflow:hidden;
}

.grafico::after{

content:"";

position:absolute;

left:0;
top:50%;

width:100%;
height:3px;

background:
linear-gradient(
90deg,
#1cff77,
#65ff9c
);

transform:
skewY(-8deg);
}

.loading{

text-align:center;

margin-top:70px;

font-size:24px;

opacity:.7;
}

</style>

</head>

<body>

<div class="topo">

<div class="logo">

<div class="icon">
🏢
</div>

<div class="textos">

<h1>
MR FIIs
</h1>

<p>
Fundos imobiliários premium
</p>

</div>

</div>

<button class="botao"
onclick="window.location='/'">

Voltar

</button>

</div>

<div class="market">

<div class="live">

<div class="ball"></div>

<h2>
FIIs AO VIVO
</h2>

</div>

<p>
Atualização automática do mercado
</p>

</div>

<div id="grid" class="grid">

<div class="loading">

Carregando FIIs...

</div>

</div>

<script>

async function carregar(){

try{

const resposta =
await fetch("/api/fiis")

const dados =
await resposta.json()

const grid =
document.getElementById("grid")

grid.innerHTML = ""

dados.results.forEach(fii => {

const alta =
fii.variacao >= 0

grid.innerHTML += `

<div class="card">

<div class="codigo">

${fii.codigo}

</div>

<div class="preco
${alta ? 'alta' : 'baixa'}">

R$ ${fii.preco}

</div>

<div class="variacao
${alta ? 'alta' : 'baixa'}">

${alta ? '+' : ''}

${fii.variacao}%

</div>

<div class="info">

Dividendos fortes • Mercado imobiliário • Atualização automática

</div>

<div class="grafico">

</div>

</div>

`

})

}catch{

document.getElementById("grid").innerHTML = `

<div class="loading">

Erro ao carregar FIIs

</div>

`

}

}

carregar()

setInterval(carregar,5000)

</script>

</body>

</html>
