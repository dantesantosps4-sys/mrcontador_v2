<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ações</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#020b1d;
color:white;
padding:20px;
padding-bottom:120px;
}

.topo{
margin-bottom:25px;
}

.topo h1{
font-size:52px;
font-weight:900;
}

.topo p{
color:#8b97b5;
font-size:18px;
margin-top:8px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.card{
background:linear-gradient(180deg,#081633,#061126);
border:1px solid rgba(255,255,255,0.06);
border-radius:26px;
padding:18px;
box-shadow:
0 0 25px rgba(0,0,0,.35),
0 0 10px rgba(59,130,246,.08);
position:relative;
overflow:hidden;
}

.card::before{
content:"";
position:absolute;
width:140px;
height:140px;
background:rgba(59,130,246,.08);
border-radius:50%;
top:-60px;
right:-60px;
}

.nome{
font-size:18px;
font-weight:800;
margin-bottom:12px;
position:relative;
z-index:2;
}

.preco{
font-size:32px;
font-weight:900;
color:#65f0a7;
margin-bottom:8px;
position:relative;
z-index:2;
}

.variacao{
font-size:15px;
font-weight:700;
margin-bottom:16px;
color:#d6d6d6;
position:relative;
z-index:2;
}

.mini{
display:flex;
justify-content:space-between;
font-size:11px;
color:#9aa8c7;
margin-bottom:10px;
position:relative;
z-index:2;
}

canvas{
width:100%;
height:40px;
background:#071122;
border-radius:12px;
position:relative;
z-index:2;
}

.nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#041027;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid rgba(255,255,255,.05);
backdrop-filter:blur(10px);
}

.nav a{
color:white;
text-decoration:none;
font-size:15px;
font-weight:700;
opacity:.9;
}

</style>
</head>

<body>

<div class="topo">
<h1>Ações</h1>
<p>Mercado brasileiro em tempo real</p>
</div>

<div class="grid" id="acoes"></div>

<div class="nav">
<a href="/">Dashboard</a>
<a href="/acoes">Ações</a>
<a href="/fiis">FIIs</a>
<a href="/ia">IA</a>
</div>

<script>

async function carregar(){

try{

const res = await fetch(
"https://brapi.dev/api/quote/PETR4,VALE3,ITUB4"
);

const data = await res.json();

const html = data.results.map(a => `

<div class="card">

<div class="nome">
${a.symbol}
</div>

<div class="preco">
R$ ${a.regularMarketPrice}
</div>

<div class="variacao">
${a.regularMarketChangePercent.toFixed(2)}%
</div>

<div class="mini">
<span>Volume: Alto</span>
<span>IA: Compra</span>
</div>

<canvas class="grafico"></canvas>

</div>

`).join("");

document.getElementById("acoes").innerHTML = html;

desenhar();

}catch{

document.getElementById("acoes").innerHTML = `
<div class="card">
Erro ao carregar mercado.
</div>
`;

}

}

function desenhar(){

const graficos = document.querySelectorAll(".grafico");

graficos.forEach(grafico=>{

const ctx = grafico.getContext("2d");

ctx.strokeStyle="#3b82f6";
ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(0,30);
ctx.lineTo(20,22);
ctx.lineTo(40,25);
ctx.lineTo(60,10);
ctx.lineTo(80,18);
ctx.lineTo(100,5);

ctx.stroke();

});

}

carregar();

</script>

</body>
</html>
